<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — IEEE ITB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-box glass-card">
      <h1>Admin Login</h1>
      <p class="auth-sub">Masuk untuk mengelola event</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="admin@ieeeitb.org" autocomplete="email" required>
          <p class="field-error" id="errEmail">Email tidak valid.</p>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" minlength="6" required>
          <p class="field-error" id="errPassword">Password minimal 6 karakter.</p>
        </div>

        <button class="btn btn-outline" type="submit" id="loginBtn">Login</button>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/pages/admin-login.js"></script>
</body>
</html>
