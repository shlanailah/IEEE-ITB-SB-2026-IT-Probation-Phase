<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Event</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    document.documentElement.classList.add('page-fade');
  </script>
  <noscript><style>html.page-fade body { opacity: 1; }</style></noscript>
</head>
<body>
  <main class="page container detail-page">
    <div class="detail-top">
      <a class="round-btn" href="dashboard.html" aria-label="Kembali ke dashboard">&#8249;</a>
      <h1 id="formTitle">Add new event</h1>
    </div>

    <div id="formContainer" class="container">
      <div id="formLoading" class="form-loading"></div>
      <form id="eventForm" class="form-card glass-card" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label class="field-label" for="title">Event name</label>
            <input class="input" type="text" id="title" name="title" placeholder="Contoh: IoT Workshop 2026" maxlength="200" required>
            <p class="field-error" id="errTitle">Event name is required</p>
          </div>

          <div class="field">
            <label class="field-label" for="date">Date</label>
            <input class="input" type="date" id="date" name="date" required>
            <p class="field-error" id="errDate">Date is required</p>
          </div>

          <div class="field">
            <label class="field-label" for="time">Time</label>
            <input class="input" type="time" id="time" name="time" required>
            <p class="field-error" id="errTime">Time is required</p>
          </div>

          <div class="field">
            <label class="field-label" for="location">Place</label>
            <input class="input" type="text" id="location" name="location" placeholder="Contoh: Aula Timur ITB" maxlength="200" required>
            <p class="field-error" id="errLocation">Place is required</p>
          </div>

          <div class="field">
            <label class="field-label" for="status">Status</label>
            <select class="select" id="status" name="status">
              <option value="upcoming">Upcoming</option>
              <option value="ongoing">Ongoing</option>
              <option value="past">Past</option>
            </select>
            <p class="field-error" id="errStatus">Status is invalid</p>
            <p class="form-hint">Updates automatically based on the selected date</p>
          </div>

          <div class="field full">
            <label class="field-label" for="image_url">Image URL <span class="hint">(opsional)</span></label>
            <input class="input" type="url" id="image_url" name="image_url" placeholder="https://..." maxlength="500">
            <p class="field-error" id="errImage">Image URL is invalid</p>
          </div>

          <div class="field full">
            <label class="field-label" for="image_file">Upload Image File <span class="hint">(opsional)</span></label>
            <input class="input file-input" type="file" id="image_file" name="image_file" accept="image/png,image/jpeg,image/webp,image/gif">
            <p class="field-error" id="errImageFile">The image upload failed</p>
            <div class="file-preview" id="imagePreview"></div>
          </div>

          <div class="field full">
            <label class="field-label" for="description">Event Description</label>
            <textarea class="textarea" id="description" name="description" placeholder="Jelaskan detail event..." maxlength="5000" required></textarea>
            <p class="field-error" id="errDescription">Description must be at least 10 characters</p>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-outline" type="submit" id="submitBtn">Add event</button>
          <a class="btn btn-ghost" href="dashboard.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/pages/event-form.js"></script>
</body>
</html>
